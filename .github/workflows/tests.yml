name: Tests

on:
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
      fail-fast: false
    name: Tests for Deployer 8 on PHP ${{ matrix.php }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not store git credentials in .git -> could be leaked/exposed by infected/malicious action.
          persist-credentials: false

      - name: Setup PHP and tools
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
        with:
          dependency-versions: highest
          composer-options: '--prefer-dist --no-progress'

      - name: Run PHPStan
        run: composer run-script phpstan

      - name: Run PHPUnit tests
        run: composer run-script tests
